name: Beyond the Prompt case study checks
on:
  pull_request:
    paths:
      - 'projects/beyond-the-prompt/**'
      - 'tests/beyond-the-prompt.test.mjs'
      - '.github/workflows/beyond-the-prompt.yml'
      - 'index.html'
      - 'pages/projects.html'
      - 'sitemap.xml'
  push:
    paths:
      - 'projects/beyond-the-prompt/**'
      - 'tests/beyond-the-prompt.test.mjs'
      - '.github/workflows/beyond-the-prompt.yml'
      - 'index.html'
      - 'pages/projects.html'
      - 'sitemap.xml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/beyond-the-prompt.test.mjs
