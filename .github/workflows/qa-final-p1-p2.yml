name: QA final P1 P2 regression
on:
  pull_request:
    paths:
      - 'projects/**'
      - 'index.html'
      - 'pages/projects.html'
      - 'tests/qa-final-p1-p2.test.mjs'
  push:
    paths:
      - 'projects/**'
      - 'index.html'
      - 'pages/projects.html'
      - 'tests/qa-final-p1-p2.test.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/qa-final-p1-p2.test.mjs tests/wph-discovery-review.test.mjs tests/wph-review-console.test.mjs tests/qa-release-blockers.test.mjs
