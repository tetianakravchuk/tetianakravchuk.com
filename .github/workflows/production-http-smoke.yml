name: Post-deployment portfolio HTTP smoke audit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-production.mjs
