name: Portfolio Phase 6 readiness checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'pages/projects.html'
      - 'projects/ai-engineering-showcase/**'
      - 'projects/wph-discovery/**'
      - 'projects/wph-review-console/**'
      - 'sitemap.xml'
      - 'tests/portfolio-phase6.test.mjs'
      - '.github/workflows/portfolio-phase6.yml'
  push:
    paths:
      - 'index.html'
      - 'pages/projects.html'
      - 'projects/ai-engineering-showcase/**'
      - 'projects/wph-discovery/**'
      - 'projects/wph-review-console/**'
      - 'sitemap.xml'
      - 'tests/portfolio-phase6.test.mjs'
      - '.github/workflows/portfolio-phase6.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/portfolio-phase6.test.mjs
