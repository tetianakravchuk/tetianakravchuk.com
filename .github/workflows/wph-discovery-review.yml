name: WPH discovery and review demo tests
on:
  pull_request:
    paths:
      - 'projects/wph-discovery/**'
      - 'projects/wph-review-console/**'
      - 'tests/wph-discovery-review.test.mjs'
      - '.github/workflows/wph-discovery-review.yml'
  push:
    paths:
      - 'projects/wph-discovery/**'
      - 'projects/wph-review-console/**'
      - 'tests/wph-discovery-review.test.mjs'
      - '.github/workflows/wph-discovery-review.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/wph-discovery-review.test.mjs
